<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/crest.svg" />
    <!-- viewport-fit=cover lets the red run under the status bar and home
         indicator once installed; the safe-area insets in index.css and the
         Layout chrome keep content clear of both. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E050F" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Liverpool FC Fan Hub</title>

    <!-- iOS ignores the web manifest's icons and display mode for home-screen
         installs, so it needs its own tags. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LFC Hub" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter carries body copy; Oswald carries scores, ranks and counters at
         broadcast scale (see font-display in tailwind.config.js). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
